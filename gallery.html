<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GalleryMe Viewer</title>
  <link rel="stylesheet" href="css/gallery.css">
</head>
<body>
  <div class="viewer">
    <div class="header">
      <div class="header-left">
        <span id="counter" class="counter">1 / 10</span>
        <span id="mediaType" class="media-type">IMAGE</span>
      </div>
      <div class="header-center">
        <button id="playBtn" class="btn btn-play">▶ Play</button>
        <input type="number" id="slideInterval" class="slide-interval" value="3" min="1" max="30" title="Seconds per slide">
        <span class="interval-label">sec</span>
        <span id="countdown" class="countdown"></span>
      </div>
      <div class="header-right">
        <a id="openUrl" href="#" target="_blank" class="btn btn-primary">Open Original ↗</a>
        <button id="downloadBtn" class="btn btn-secondary">Download ⬇</button>
        <button id="closeBtn" class="btn btn-close">✕ Close</button>
      </div>
    </div>

    <button id="prevBtn" class="nav-btn nav-prev" title="Previous (←)">‹</button>
    <button id="nextBtn" class="nav-btn nav-next" title="Next (→)">›</button>

    <div id="content" class="content"></div>

    <div class="footer">
      <div class="url-container">
        <span class="url-label">URL:</span>
        <a id="urlDisplay" href="#" target="_blank" class="url-link"></a>
        <button id="copyUrl" class="btn-copy" title="Copy URL">Copy</button>
      </div>
    </div>

    <div id="thumbStrip" class="thumb-strip"></div>
  </div>

  <script src="js/gallery.js"></script>
</body>
</html>
